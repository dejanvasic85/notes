<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Browser and status bar chrome, tracking --color-paper in app.css so it
			meets the header rather than sitting against it. The manifest carries
			only the light value; these override it per scheme.

			data-scheme-color repeats each tag's own value because `content` is
			live — an explicit Light or Dark overwrites both tags, and this is what
			System restores them from. Read by syncThemeColorMeta in lib/theme.ts.
		-->
		<meta
			name="theme-color"
			media="(prefers-color-scheme: light)"
			content="#fcfbfd"
			data-scheme-color="#fcfbfd"
		/>
		<meta
			name="theme-color"
			media="(prefers-color-scheme: dark)"
			content="#1c1a20"
			data-scheme-color="#1c1a20"
		/>
		<!--
			Stamps an explicit theme choice before first paint, so a stored Light
			or Dark never flashes the other one on load. Must stay blocking and
			inline — a deferred or bundled script runs too late.

			"System" stores nothing and needs no attribute: app.css resolves it
			from prefers-color-scheme, so it cannot flash at all.

			The key and attribute mirror themeStorageKey and themeAttribute in
			src/lib/theme.ts. Storage throws in Safari private browsing, and an
			uncaught throw here would block the rest of the head.
		-->
		<script>
			try {
				const storedTheme = localStorage.getItem('notes:theme');
				if (storedTheme === 'light' || storedTheme === 'dark') {
					document.documentElement.setAttribute('data-theme', storedTheme);

					// The tags above select by OS scheme, which an explicit choice can
					// contradict. Point both at the chosen one now rather than waiting
					// for hydration, or the chrome briefly wears the opposite colour.
					const tags = document.querySelectorAll('meta[name="theme-color"]');
					const chosen = document.querySelector(
						`meta[name="theme-color"][media*="${storedTheme}"]`
					);
					if (chosen) {
						for (const tag of tags) {
							tag.setAttribute('content', chosen.dataset.schemeColor);
						}
					}
				}
			} catch {
				/* no stored preference is recoverable — fall through to System */
			}

			/*
			 * Chromium fires beforeinstallprompt once the install criteria are met,
			 * which can be before Svelte hydrates. The event is the only way to open
			 * the real install prompt later, so park it here for InstallState to
			 * adopt — see src/lib/state/installState.svelte.ts.
			 */
			window.__notesInstallPrompt = null;
			window.addEventListener('beforeinstallprompt', (event) => {
				event.preventDefault();
				window.__notesInstallPrompt = event;
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-canvas text-ink">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
