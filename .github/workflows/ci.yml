name: CI
env:
  AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
  AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
  AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PUBLIC_BUILD: ${{ github.ref_name }}-${{ github.run_number }}
  PRISMA_FIELD_ENCRYPTION_KEY: ${{ secrets.PRISMA_FIELD_ENCRYPTION_KEY }}
  PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
  SES_AWS_ACCESS_KEY_ID: ${{ secrets.SES_AWS_ACCESS_KEY_ID }}
  SES_AWS_SECRET_ACCESS_KEY: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY }}

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
jobs:
  build:
    name: Check and test
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Add Svelte Check annotator
        uses: prgm-dev/svelte-check-pr-annotator@main
      - name: Run Svelte-Check
        run: pnpm check
      - name: Run ESLint
        run: pnpm lint
      - name: Run type check
        run: pnpm build:tsc
      - name: Run unit tests
        run: pnpm test:unit
      - name: Build application
        run: pnpm build
  test:
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      PUBLIC_BASE_URL: http://localhost:3377
      HOME: /root
    name: Test Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: preview
    container:
      # Keep in step with @playwright/test in package.json — the image ships the
      # browser binaries, and Playwright refuses to launch against a mismatch.
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build:migrate
      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=list
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  test_offline:
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      PUBLIC_BASE_URL: http://localhost:3377
      HOME: /root
    name: Test offline mode
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: preview
    container:
      # Keep in step with @playwright/test in package.json — the image ships the
      # browser binaries, and Playwright refuses to launch against a mismatch.
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The service worker precaches nothing in dev, so this suite builds and
      # serves the production output itself — see playwright.offline.config.ts.
      # It runs on 3377 like the suite above, because Auth0 only accepts a
      # callback on that origin and one test signs in to reach the board. The
      # two jobs are on separate runners, so sharing the port costs nothing.
      - name: Run offline Playwright tests
        run: pnpm exec playwright test --config playwright.offline.config.ts --reporter=list
      - name: Upload offline test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-offline-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
