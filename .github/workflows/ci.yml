name: CI
env:
  # Not pulled from Vercel like the other app env vars: Preview deployments get
  # a dynamic per-build URL, so there's no one "correct" value, and the build
  # job never actually serves the app - it only needs *some* valid value to
  # satisfy $env/static/public at build/check time.
  PUBLIC_BASE_URL: http://localhost:3377
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
jobs:
  build:
    name: Check and test
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Pulls the app's own env vars (AUTH0_*, DATABASE_URL, SESSION_SECRET, etc.)
      # from Vercel's "Preview" environment into .env.local, which Vite loads
      # automatically - single source of truth instead of duplicating them as
      # GitHub secrets too. Needed here because this job builds/typechecks the
      # app locally; the test jobs below don't - they run against the real
      # Vercel preview deployment instead.
      - name: Pull environment variables from Vercel
        run: |
          pnpm add --global vercel@latest
          vercel env pull .env.local --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Add Svelte Check annotator
        uses: prgm-dev/svelte-check-pr-annotator@main
      - name: Run Svelte-Check
        run: pnpm check
      - name: Run ESLint
        run: pnpm lint
      - name: Run type check
        run: pnpm build:tsc
      - name: Run unit tests
        run: pnpm test:unit
      - name: Build application
        run: pnpm build
  test:
    permissions:
      contents: read
      deployments: read
      statuses: read
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      HOME: /root
    name: Test Playwright
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      # Keep in step with @playwright/test in package.json — the image ships the
      # browser binaries, and Playwright refuses to launch against a mismatch.
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Vercel's git integration already built and deployed this commit in
      # parallel with this workflow - wait for that deployment instead of
      # building the app a second time here. Official Vercel action - polls
      # GitHub's Deployments API, so it only needs GITHUB_TOKEN, no Vercel
      # token to provision.
      - name: Wait for Vercel preview deployment
        uses: vercel/wait-for-deployment-action@0e2b0c5c5cce31f1648108aeec56467187aca037
        id: deployment
        with:
          environment: preview
          timeout: 300
          check-interval: 10
      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=list
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.deployment.outputs.deployment-url }}
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  test_offline:
    permissions:
      contents: read
      deployments: read
      statuses: read
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      HOME: /root
    name: Test offline mode
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      # Keep in step with @playwright/test in package.json — the image ships the
      # browser binaries, and Playwright refuses to launch against a mismatch.
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Vercel's deployment is already a production build with a working
      # service worker - what this suite needs (see playwright.offline.config.ts)
      # - so it can test against that instead of building its own copy locally.
      - name: Wait for Vercel preview deployment
        uses: vercel/wait-for-deployment-action@0e2b0c5c5cce31f1648108aeec56467187aca037
        id: deployment
        with:
          environment: preview
          timeout: 300
          check-interval: 10
      - name: Run offline Playwright tests
        run: pnpm exec playwright test --config playwright.offline.config.ts --reporter=list
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.deployment.outputs.deployment-url }}
      - name: Upload offline test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-offline-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
