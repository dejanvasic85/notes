# Not a real workspace - this file only exists for allowBuilds/overrides below.
# Some pnpm versions (Vercel's build resolves a different one than local/CI)
# refuse to install at all without an explicit packages field once this file
# is present.
packages:
  - '.'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  browser-tabs-lock: true
  esbuild: true
  prisma: true

# Every TipTap package resolves @tiptap/pm 3.29.0, but the tree ended up with
# two prosemirror-model instances behind it. ProseMirror compares node types by
# object identity, so a second copy makes any command that builds a fragment —
# toggleBulletList, toggleTaskList — throw "Can not convert <> to a Fragment".
# Nothing dedupes this on its own; the versions are only a patch apart and both
# satisfy every range asking for them.
overrides:
  prosemirror-model: 1.25.11
